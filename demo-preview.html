<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Fee Manager — offline demo</title>
<style>
:root {
  --fg: #172b4d; --muted: #626f86; --line: #dcdfe4; --bg: transparent; --panel: #f7f8f9;
  --input-bg: #ffffff; --input-line: #b3b9c4; --focus: #388bff;
  --green: #1f845a; --green-bg: #dcfff1;
  --yellow: #7f5f01; --yellow-bg: #fff7d6; --yellow-bar: #e2b203;
  --orange: #a54800; --orange-bg: #fff3eb; --orange-bar: #f18d13;
  --red: #ae2e24; --red-bg: #ffeceb; --red-bar: #e2483d;
  --gray-bar: #dcdfe4; --btn: #091e420f; --btn-hover: #091e4224; --primary: #0c66e4; --primary-fg: #fff;
}
:root[data-theme="dark"] {
  --fg: #b6c2cf; --muted: #8c9bab; --line: #38414a; --panel: #22272b;
  --input-bg: #22272b; --input-line: #738496; --focus: #85b8ff;
  --green: #7ee2b8; --green-bg: #164b35;
  --yellow: #f5cd47; --yellow-bg: #533f04; --yellow-bar: #cf9f02;
  --orange: #fec195; --orange-bg: #702e00; --orange-bar: #f18d13;
  --red: #fd9891; --red-bg: #5d1f1a; --red-bar: #e2483d;
  --gray-bar: #454f59; --btn: #a1bdd914; --btn-hover: #a6c5e229; --primary: #579dff; --primary-fg: #1d2125;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  color: var(--fg);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.mfm { padding: 2px 2px 8px; }
.mfm.pad { padding: 16px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* summary */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiles.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tile { background: var(--panel); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 11.5px; color: var(--muted); min-height: 16px; }
.tile.hot { background: var(--orange-bg); }
.tile.hot .v, .tile.hot .k { color: var(--orange); }
.tile.late { background: var(--red-bg); }
.tile.late .v, .tile.late .k, .tile.late .sub { color: var(--red); }
.tile.done { background: var(--green-bg); }
.tile.done .v, .tile.done .k { color: var(--green); }

.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--gray-bar); margin: 10px 0 4px; }
.bar i { display: block; height: 100%; }
.bar .p { background: var(--green); } .bar .l { background: var(--red-bar); }
.bar .w { background: var(--orange-bar); } .bar .t { background: var(--yellow-bar); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--gray-bar); }
.legend .p::before { background: var(--green); } .legend .l::before { background: var(--red-bar); }
.legend .w::before { background: var(--orange-bar); } .legend .t::before { background: var(--yellow-bar); }

.note { border-radius: 6px; padding: 6px 10px; font-size: 12.5px; margin: 6px 0; }
.note.warn { background: var(--yellow-bg); color: var(--yellow); }
.note.err { background: var(--red-bg); color: var(--red); }
.note.info { background: var(--panel); color: var(--muted); }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.num { text-align: right; }
td.idx { color: var(--muted); width: 22px; padding-top: 10px; font-size: 12px; }
tr.paid td input.name { color: var(--muted); }

input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--input-bg);
  border: 1px solid var(--input-line); border-radius: 4px; padding: 5px 6px; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
input.bad { outline: 2px solid var(--red-bar); outline-offset: -1px; }
input:disabled, select:disabled { opacity: .7; }
input.amt { text-align: right; font-variant-numeric: tabular-nums; }
td.c-amt { width: 104px; } td.c-st { width: 148px; } td.c-inv { width: 96px; } td.c-date { width: 136px; } td.c-act { width: 74px; white-space: nowrap; }
select.s0 { background: var(--input-bg); }
select.s1 { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-bar); font-weight: 600; }
select.s2 { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-bar); font-weight: 600; }
select.s2.late { background: var(--red-bg); color: var(--red); border-color: var(--red-bar); }
select.s3 { background: var(--green-bg); color: var(--green); border-color: var(--green); font-weight: 600; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.hint.warn { color: var(--yellow); } .hint.late { color: var(--red); font-weight: 600; } .hint.ok { color: var(--green); }

.pill { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.s1 { background: var(--yellow-bg); color: var(--yellow); }
.pill.s2 { background: var(--orange-bg); color: var(--orange); }
.pill.late { background: var(--red-bg); color: var(--red); }

button { font: inherit; color: var(--fg); background: var(--btn); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:hover { background: var(--btn-hover); }
button.primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
button.icon { padding: 4px 6px; background: transparent; color: var(--muted); font-size: 13px; line-height: 1; }
button.icon:hover { background: var(--btn-hover); color: var(--fg); }
button.danger { background: var(--red-bg); color: var(--red); font-size: 12px; padding: 4px 6px; }
button:disabled { opacity: .45; cursor: default; }
a.link { color: var(--primary); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }

.foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.foot .grow { flex: 1; }
.foot label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.foot label input { width: 110px; }
.savebar { display: flex; align-items: center; gap: 8px; }
.savebar .state { font-size: 12px; color: var(--muted); }
.savebar .state.dirty { color: var(--orange); font-weight: 600; }

h2 { font-size: 14px; margin: 18px 0 6px; }
h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.empty { padding: 14px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 8px; }
.demo-banner { background: var(--yellow-bg); color: var(--yellow); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 10px; }
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.tpl { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
.tpl .row { display: flex; gap: 6px; margin-bottom: 6px; }
textarea { min-height: 84px; resize: vertical; font-family: inherit; }
.minibar { display: inline-flex; width: 90px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--gray-bar); vertical-align: middle; }
.minibar i { display: block; height: 100%; }

@media (max-width: 560px) {
  .tiles, .tiles.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  td.c-inv, th.c-inv { display: none; }
  td.c-st { width: 120px; } td.c-date { width: 120px; }
}

/* fee schedule stage rows (two-line layout for the narrow card back) */
.stage { border-bottom: 1px solid var(--line); padding: 6px 0; }
.stage.head { padding: 4px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.stage .l1 { display: grid; grid-template-columns: 20px minmax(0, 1fr) 108px 156px; gap: 6px; align-items: center; }
.stage .l2 { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.stage .l2 .idx { width: 20px; flex: none; }
.stage .l2 input.inv { width: 104px; flex: none; }
.stage .l2 .dl { flex: none; }
.stage .l2 .dl input[type="date"] { width: 132px; }
.stage .l2 .dl.rv input { width: 84px; }
.stage .l2 .hint { flex: 1 1 150px; min-width: 0; }
.stage .l2 .acts { flex: none; margin-left: auto; }
.stage .idx { color: var(--muted); font-size: 12px; text-align: center; }
.stage .l2 input { padding: 3px 6px; font-size: 12.5px; }
.stage .dl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.stage .hint { margin-top: 0; overflow: hidden; text-overflow: ellipsis; }
.stage .acts { white-space: nowrap; }
.stage.paid input.name, .stage.paid input.amt { color: var(--muted); }
@media (max-width: 520px) {
  .stage .l1 { grid-template-columns: 20px minmax(0, 1fr) 96px; }
  .stage .l1 select { grid-column: 2 / 4; }
}
@media (max-width: 520px) { .stage.head .l1 span:nth-child(4) { display: none; } }

/* overview: CSV export and heading row */
.h2row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.h2row button { margin-bottom: 4px; }
.csvbox { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0 10px; }
textarea.csv { min-height: 140px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; margin-top: 6px; }
/* settings */
.field.two { display: flex; gap: 16px; flex-wrap: wrap; }
.small { font-size: 12px; }
.note .foot { margin-top: 6px; }
a.link[href] { cursor: pointer; }

.field.two > div > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
/* static pages (privacy, support) */
.doc { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; font-size: 15px; line-height: 1.6; }
.doc h1 { font-size: 24px; margin: 0 0 4px; } .doc h2 { font-size: 17px; margin: 26px 0 6px; }
.doc p, .doc li { color: var(--fg); } .doc .muted { font-size: 13px; }
.doc code { background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
/* welcome modal */
.lead { font-size: 15px; margin: 0 0 10px; }
ol.steps { margin: 0 0 12px; padding-left: 22px; }
ol.steps li { margin-bottom: 8px; line-height: 1.5; }

body { background: #f1f2f4; padding: 20px; }
.demo-wrap { max-width: 760px; margin: 0 auto 20px; background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px #091e4226; }
.demo-wrap.wide { max-width: 980px; }
.demo-h { font-size: 12px; font-weight: 700; color: #626f86; letter-spacing: .04em; margin-bottom: 10px; }
.front { width: 272px; background: #fff; border-radius: 8px; box-shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f; padding: 8px 12px; }
.front .nm { margin-bottom: 6px; }
.bdg { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 12px; margin: 0 4px 4px 0; background: #091e420f; }
.bdg.red { background: #c9372c; color: #fff; } .bdg.orange { background: #e2740f; color: #fff; }
.bdg.yellow { background: #f5cd47; color: #533f04; } .bdg.green { background: #1f845a; color: #fff; }
.sec-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
.langbar { max-width: 760px; margin: 0 auto 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #626f86; }
</style>
</head>
<body>
<div class="langbar"><span>Language / 语言:</span><button id="lang-en">English</button><button id="lang-zh">中文</button><span>· v<span id="ver"></span> offline demo, fictional data</span></div>
<div class="demo-wrap"><div class="demo-h">① CARD FRONT BADGES / 卡片正面徽章</div><div class="front"><div class="nm" id="demo-name"></div><div id="demo-badges"></div></div></div>
<div class="demo-wrap"><div class="demo-h">② CARD BACK / 卡片背面</div><div class="sec-title" id="demo-sec"></div><div id="mfm-section" class="mfm"></div></div>
<div class="demo-wrap wide"><div class="demo-h">③ BOARD BUTTON / 看板按钮</div><div id="mfm-overview" class="mfm"></div></div>
<div class="demo-wrap"><div class="demo-h">④ SETTINGS / 设置</div><div id="mfm-settings" class="mfm"></div></div>
<script>

  add('st0', 'Not started', '未开始');

  add('note_done_wait', 'Done {0}d ago, not invoiced', '完成 {0} 天未开票');

  add('note_nodue', 'No due date set', '未设到期日');

  add('note_in', 'Due in {0} days', '{0} 天后到期');

  add('note_paid_on', 'Paid {0}', '收款 {0}');

  add('bd_prog', 'Paid {0} / {1}', '已收 {0} / {1}');
  add('fee_progress', 'Fee progress', '收费进度');
  add('recv_now', 'Receivable now', '应收未收');

  // default template
  add('tpl_name', 'Three-stage example (fill in amounts)', '三阶段示例（金额自填）');

  add('append_tpl', 'Append template stages: {0}', '追加模板阶段：{0}');
  add('del_menu', 'Delete this card\'s fee schedule…', '删除本卡收费表…');
  add('open_ov', 'Open receivables overview', '打开应收总览');
  add('too_many', 'Too many stages: this would exceed Trello\'s per-card storage limit. Nothing was added.', '阶段太多，超出 Trello 单卡存储上限，未追加。');
  add('del_title', 'Delete fee schedule', '删除收费表');
  add('del_msg', 'This deletes every fee stage recorded on this card. It cannot be undone.', '将删除本卡片的全部收费阶段记录，无法恢复。');
  add('del_ok', 'Delete', '删除');
  add('cancel', 'Cancel', '取消');

  // card-back section
  add('err_amount', 'An amount is not valid (digits only, up to two decimals). Fix it, then save.', '有金额格式不对（只能是数字，最多两位小数），改正后再保存。');
  add('err_recv', 'Received cannot be more than the stage amount. Set the stage to Paid instead.', '已收金额不能超过阶段金额。全部收到请直接把状态改为「已收款」。');

  add('btn_reload', 'Load their version (discard mine)', '载入对方的版本（放弃我的修改）');

  add('k_total', 'Contract total', '合同总额');

  add('saving', 'Saving…', '保存中…');

  add('discard', 'Discard', '撤销');
  add('save', 'Save', '保存');
  add('saved', 'Saved', '已保存');
  add('ph_stage', 'Stage name (e.g. Work delivered)', '阶段名称（如：递交申请）');

  add('up', 'Move up', '上移');
  add('down', 'Move down', '下移');
  add('empty', 'No fee stages yet.', '还没有收费阶段。');
  add('h_stage', 'Stage', '阶段');
  add('h_amount', 'Amount', '金额');
  add('h_status', 'Status', '状态');
  add('optional', 'optional', '可不填');
  add('demo', 'Demo mode: not connected to Trello. The data is fictional and resets on refresh.', '演示模式：未连接 Trello，数据为虚构示例，刷新即还原。');
  add('add_stage', '+ Add stage', '+ 添加阶段');
  add('contract', 'Contract total (for cross-check)', '合同总额（用于核对）');
  add('no_access', 'Fee details are visible to board members with edit access only.', '收费明细仅对有编辑权限的看板成员显示。');

  // overview
  add('err_read', 'Could not read board data: {0}', '读取看板数据失败：{0}');
  add('open_card', 'Open card', '打开卡片');
  add('t_over', 'Overdue', '逾期未付');

      cards: [
        { id: 'c1', name: N.c + 'A' + N.m + '101', idList: 'l2' },
        { id: 'c2', name: N.c + 'B' + N.m + '102', idList: 'l1' },
        { id: 'c3', name: N.c + 'C' + N.m + '103', idList: 'l2' },
        { id: 'c4', name: N.c + 'D' + N.m + '104' + N.none, idList: 'l1' }
      ],
      fee: {
        c1: { v: 1, rv: 3, c: 660000, st: [
          { i: 'a1', n: N.s1, a: 165000, s: 3, inv: 'INV-0001', dd: ago(60), bd: ago(60), d: ago(53), pd: ago(58) },
          { i: 'a2', n: N.s2, a: 220000, s: 2, r: 100000, inv: 'INV-0002', dd: ago(21), bd: ago(20), d: ago(13) },
          { i: 'a3', n: N.s3, a: 165000, s: 1, dd: ago(3) },
          { i: 'a4', n: N.s4, a: 110000, s: 0 }
        ] },
        c2: { v: 1, rv: 2, st: [
          { i: 'b1', n: N.s1, a: 200000, s: 3, inv: 'INV-0003', dd: ago(30), bd: ago(30), d: ago(23), pd: ago(29) },
          { i: 'b2', n: N.s2, a: 250000, s: 2, inv: 'INV-0004', dd: ago(2), bd: ago(2), d: MFM.addDays(today, 5) },
          { i: 'b3', n: N.s4, a: 100000, s: 0 }
        ] },
        c3: { v: 1, rv: 2, st: [
          { i: 'd1', n: N.s1, a: 300000, s: 3, inv: 'INV-0005', dd: ago(90), bd: ago(90), d: ago(83), pd: ago(88) },
          { i: 'd2', n: N.s4, a: 300000, s: 3, inv: 'INV-0006', dd: ago(10), bd: ago(10), d: ago(3), pd: ago(5) }
        ] }
      }
    };
    var renderers = [];
    var fire = function () { renderers.forEach(function (fn) { setTimeout(fn, 0); }); };
    var cardId = function (scope) { return scope === 'card' ? 'c1' : scope; };
    var clone = function (v) { return JSON.parse(JSON.stringify(v)); };
    mock = {
      _store: store,
      get: function (scope, vis, key, def) {
        var v = scope === 'board' ? store.board[key] : (store[key] || {})[cardId(scope)];
        return Promise.resolve(v === undefined ? def : clone(v));
      },
      set: function (scope, vis, key, value) {
        if (scope === 'board') store.board[key] = clone(value);
        else { store[key] = store[key] || {}; store[key][cardId(scope)] = clone(value); }
        fire();
        return Promise.resolve();
      },
      remove: function (scope, vis, key) {
        if (scope === 'board') delete store.board[key];
        else if (store[key]) delete store[key][cardId(scope)];
        fire();
        return Promise.resolve();
      },
      render: function (fn) { renderers.push(fn); return fn(); },
      cards: function () { return Promise.resolve(store.cards.slice()); },
      lists: function () { return Promise.resolve(store.lists.slice()); },
      getContext: function () { return { card: 'c1', permissions: { card: 'write', board: 'write' } }; },
      isMemberSignedIn: function () { return true; },
      sizeTo: function () { return Promise.resolve(); },
      showCard: function () { return Promise.resolve(); },
      closePopup: function () { return Promise.resolve(); },
      closeModal: function () { return Promise.resolve(); }
    };
    return mock;
  };

  root.MFM = MFM;
  if (typeof module !== 'undefined' && module.exports) module.exports = MFM;

<script>
/* Matter Fee Manager — the staged fee schedule on the card back
 * Save strategy: Trello reloads the card-back-section iframe after t.set, so text and amount edits
 * stay local (shown as "unsaved") and are written in one go when:
 *   1) a status changes  2) Save is clicked  3) the user clicks outside the schedule (window blur)
 * Before writing, the stored revision counter is compared with the one loaded; if somebody else
 * saved in between, nothing is overwritten until the user chooses which version to keep.
 */
(function () {
  'use strict';
  var MFM = window.MFM, h = MFM.h, tr = MFM.tr;

  MFM.mountSection = function (t, root) {
    var state = { v: 1, rv: 0, st: [] };
    var cfg = MFM.cfg(null);
    var loadedRv = 0;
    var dirty = false, saving = false, canWrite = true, conflict = false, errMsg = '', armedDelete = null;
    var summaryEl, barEl, saveEl, errEl, rowsEl;

    try {
      var ctx = t.getContext() || {};
      if (ctx.permissions && ctx.permissions.card && ctx.permissions.card !== 'write') canWrite = false;
    } catch (e) { /* if permissions are unavailable assume writable; a failed write shows an error */ }

    function resize() { try { t.sizeTo('#' + root.id); } catch (e) { /* demo mode */ } }

    function load() {
      return Promise.all([
        t.get('card', 'shared', MFM.KEY),
        t.get('board', 'shared', MFM.CFG_KEY)
      ]).then(function (r) {
        cfg = MFM.cfg(r[1]);
        if (!MFM.canSee(t)) { MFM.fill(root, [h('div', { class: 'note info', text: tr('no_access') })]); resize(); return; }
        if (!dirty && !saving) { state = MFM.normalize(r[0]); loadedRv = state.rv || 0; conflict = false; }
        draw();
      });
    }

    function markDirty() { dirty = true; drawSummary(); drawSave(); }
    function hasBadInput() { return !!root.querySelector('input.bad'); }

    function save(force) {
      if (!canWrite || saving) return Promise.resolve(false);
      if (hasBadInput()) { errMsg = tr('err_amount'); drawErr(); return Promise.resolve(false); }
      saving = true; errMsg = ''; drawSave(); drawErr();
      var fail = function (err) {
        saving = false;
        errMsg = tr('err_save', err && err.message ? err.message : tr('err_unknown'));
        drawSave(); drawErr();
        return false;
      };
      return t.get('card', 'shared', MFM.KEY).then(function (cur) {
        var curRv = cur && typeof cur.rv === 'number' ? cur.rv : 0;
        if (!force && curRv !== loadedRv) {      // somebody else saved since we loaded
          saving = false; conflict = true; drawSave(); drawErr();
          return false;
        }
        var payload = MFM.compact(state);
        payload.rv = curRv + 1;
        if (MFM.sizeOf(payload) > MFM.SIZE_LIMIT) {
          saving = false; errMsg = tr('err_size'); drawSave(); drawErr();
          return false;
        }
        return t.set('card', 'shared', MFM.KEY, payload).then(function () {
          saving = false; dirty = false; conflict = false; loadedRv = payload.rv; state.rv = payload.rv;
          drawSave(); drawErr();
          return true;
        }, fail);
      }, fail);
    }

    function revert() { dirty = false; conflict = false; errMsg = ''; return load(); }

    /* ---------- summary ---------- */
    function drawSummary() {
      var r = MFM.summarize(state);
      var sub = [];
      if (r.toInvoice > 0) sub.push(tr('sub_toinv', MFM.fmtMoney(r.toInvoice, true)));
      if (r.awaiting > 0) sub.push(tr('sub_unpaid', MFM.fmtMoney(r.awaiting, true)));
      if (r.overdue > 0) sub.push(tr('sub_over', r.overdueDays));
      MFM.fill(summaryEl, [
        h('div', { class: 'tile' }, [
          h('div', { class: 'k', text: tr('k_total') }),
          h('div', { class: 'v', text: MFM.fmtMoney(r.total) }),
          h('div', { class: 'sub', text: tr('n_stages', r.n) })
        ]),
        h('div', { class: 'tile' + (r.sum > 0 && r.paid === r.sum ? ' done' : '') }, [
          h('div', { class: 'k', text: tr('k_recv') }),
          h('div', { class: 'v', text: MFM.fmtMoney(r.paid) }),
          h('div', { class: 'sub', text: tr('n_of_stages', r.nPaid, r.n) })
        ]),
        h('div', { class: 'tile' + (r.overdue > 0 ? ' late' : (r.receivable > 0 ? ' hot' : '')) }, [
          h('div', { class: 'k', text: tr('k_now') }),
          h('div', { class: 'v', text: MFM.fmtMoney(r.receivable) }),
          h('div', { class: 'sub', text: sub.join(' · ') || tr('sub_none') })
        ]),
        h('div', { class: 'tile' }, [
          h('div', { class: 'k', text: tr('k_notdue') }),
          h('div', { class: 'v', text: MFM.fmtMoney(r.notDue) }),
          h('div', { class: 'sub', text: tr('sub_notdone') })
        ])
      ]);

      var base = r.sum > 0 ? r.sum : 1;
      var pct = function (v) { return 'width:' + (v / base * 100).toFixed(2) + '%'; };
      MFM.fill(barEl, [
        h('div', { class: 'bar' }, [
          h('i', { class: 'p', style: pct(r.paid) }),
          h('i', { class: 'l', style: pct(r.overdue) }),
          h('i', { class: 'w', style: pct(r.awaiting - r.overdue) }),
          h('i', { class: 't', style: pct(r.toInvoice) })
        ]),
        h('div', { class: 'legend' }, [
          h('span', { class: 'p', text: tr('lg_recv') }),
          h('span', { class: 'l', text: tr('lg_over') }),
          h('span', { class: 'w', text: tr('lg_inv') }),
          h('span', { class: 't', text: tr('lg_done') }),
          h('span', { text: tr('lg_notdue') })
        ]),
        r.mismatch ? h('div', {
          class: 'note warn',
          text: tr('mismatch', MFM.fmtMoney(r.sum), MFM.fmtMoney(r.contract), MFM.fmtMoney(Math.abs(r.contract - r.sum)))
        }) : null
      ]);
      resize();
    }

    function drawSave() {
      if (!saveEl) return;
      if (!canWrite) { MFM.fill(saveEl, [h('span', { class: 'state', text: tr('ro') })]); return; }
      if (saving) { MFM.fill(saveEl, [h('span', { class: 'state', text: tr('saving') })]); return; }
      if (dirty) {
        MFM.fill(saveEl, [
          h('span', { class: 'state dirty', text: tr('unsaved') }),
          h('button', { text: tr('discard'), onclick: revert }),
          h('button', { class: 'primary', text: tr('save'), onclick: function () { save(); } })
        ]);
      } else {
        MFM.fill(saveEl, [h('span', { class: 'state', text: tr('saved') })]);
      }
    }

    function drawErr() {
      if (!errEl) return;
      MFM.fill(errEl, [
        conflict ? h('div', { class: 'note err' }, [
          h('div', { text: tr('err_conflict') }),
          h('div', { class: 'foot' }, [
            h('button', { text: tr('btn_reload'), onclick: revert }),
            h('button', { text: tr('btn_overwrite'), onclick: function () { save(true); } })
          ])
        ]) : null,
        errMsg ? h('div', { class: 'note err', text: errMsg }) : null
      ]);
      resize();
    }

    /* ---------- stage rows ---------- */
    function stageRow(s, idx) {
      var note = MFM.stageNote(s);
      var dis = !canWrite;

      var name = h('input', {
        type: 'text', class: 'name', value: s.n, placeholder: tr('ph_stage'), maxlength: '60', disabled: dis,
        oninput: function () { s.n = name.value; markDirty(); }
      });
      var amt = h('input', {
        type: 'text', class: 'amt', inputmode: 'decimal', value: MFM.moneyInput(s.a), disabled: dis,
        oninput: function () {
          var c = MFM.parseMoney(amt.value);
          if (c === null) { amt.classList.add('bad'); dirty = true; drawSave(); return; }
          amt.classList.remove('bad');
          s.a = c;
          if (s.r && s.r > s.a) s.r = s.a;
          markDirty();
        },
        onblur: function () { if (!amt.classList.contains('bad')) amt.value = MFM.moneyInput(s.a); }
      });
      var sel = h('select', {
        class: 's' + s.s + (note.kind === 'late' ? ' late' : ''), disabled: dis,
        onchange: function () {
          MFM.setStatus(s, +sel.value, cfg);
          dirty = true;
          draw();
          save(); // a status change saves immediately
        }
      }, [0, 1, 2, 3].map(function (id) {
        var o = h('option', { value: String(id), text: MFM.statusLabel(id) });
        if (id === s.s) o.selected = true;
        return o;
      }));
      var inv = h('input', {
        type: 'text', class: 'inv', value: s.inv || '', placeholder: tr('ph_inv'), maxlength: '24', disabled: dis,
        oninput: function () { if (inv.value.trim()) s.inv = inv.value.trim(); else delete s.inv; markDirty(); }
      });

      // date field: paid stages show the date paid, others the payment due date
      var dateKey = s.s === 3 ? 'pd' : 'd';
      var date = h('input', {
        type: 'date', value: s[dateKey] || '', disabled: dis || s.s < 2,
        title: s.s === 3 ? tr('ti_paid') : tr('ti_due'),
        onchange: function () { if (date.value) s[dateKey] = date.value; else delete s[dateKey]; markDirty(); drawRows(); }
      });

      // part payment: only meaningful while the stage is invoiced and unpaid
      var recv = null;
      if (s.s === 2) {
        var rin = h('input', {
          type: 'text', class: 'amt', inputmode: 'decimal', placeholder: '0.00', disabled: dis,
          value: s.r ? MFM.moneyInput(s.r) : '', title: tr('ti_recv'),
          oninput: function () {
            var c = MFM.parseMoney(rin.value);
            if (c === null || c > s.a) {
              rin.classList.add('bad'); dirty = true; drawSave();
              if (c !== null) { errMsg = tr('err_recv'); drawErr(); }
              return;
            }
            rin.classList.remove('bad');
            if (errMsg) { errMsg = ''; drawErr(); }
            if (c > 0) s.r = c; else delete s.r;
            markDirty();
          }
        });
        recv = h('label', { class: 'dl rv' }, [h('span', { text: tr('l_recv') }), rin]);
      }

      var del;
      if (armedDelete === s.i) {
        del = h('button', { class: 'danger', text: tr('confirm_del'), disabled: dis, onclick: function () {
          state.st.splice(idx, 1); armedDelete = null; dirty = true; draw();
        } });
      } else {
        del = h('button', { class: 'icon', text: '✕', title: tr('ti_del'), disabled: dis, onclick: function () { armedDelete = s.i; drawRows(); } });
      }
      var move = function (d) {
        return function () {
          var j = idx + d;
          if (j < 0 || j >= state.st.length) return;
          var tmp = state.st[idx]; state.st[idx] = state.st[j]; state.st[j] = tmp;
          dirty = true; draw();
        };
      };

      var dates = [];
      if (s.dd) dates.push(tr('d_done', MFM.fmtDate(s.dd)));
      if (s.bd) dates.push(tr('d_inv', MFM.fmtDate(s.bd)));
      var hint = (s.s === 2 && s.r ? tr('note_part', MFM.fmtMoney(s.r, true)) + ' · ' : '') + note.text;

      return h('div', { class: 'stage' + (s.s === 3 ? ' paid' : '') }, [
        h('div', { class: 'l1' }, [h('span', { class: 'idx', text: String(idx + 1) }), name, amt, sel]),
        h('div', { class: 'l2' }, [
          h('span', { class: 'idx' }),
          inv,
          h('label', { class: 'dl' }, [h('span', { text: s.s === 3 ? tr('l_paid') : tr('l_due') }), date]),
          recv,
          h('span', { class: 'hint ' + (note.kind === 'warn' ? 'warn' : note.kind === 'late' ? 'late' : note.kind === 'ok' ? 'ok' : ''),
            text: hint, title: dates.join(' · ') }),
          h('span', { class: 'acts' }, [
            h('button', { class: 'icon', text: '↑', title: tr('up'), disabled: dis || idx === 0, onclick: move(-1) }),
            h('button', { class: 'icon', text: '↓', title: tr('down'), disabled: dis || idx === state.st.length - 1, onclick: move(1) }),
            del
          ])
        ])
      ]);
    }

    function drawRows() {
      if (!state.st.length) {
        var kids = [h('div', { text: tr('empty') })];
        if (canWrite) {
          kids.push(h('div', { class: 'foot', style: 'justify-content:center' }, cfg.tpls.map(function (tpl) {
            return h('button', { text: tr('use_tpl', tpl.n), onclick: function () {
              state.st = MFM.fromTemplate(tpl).st; dirty = true; draw();
            } });
          })));
        }
        MFM.fill(rowsEl, [h('div', { class: 'empty' }, kids)]);
      } else {
        MFM.fill(rowsEl, [
          h('div', { class: 'stage head' }, [h('div', { class: 'l1' }, [
            h('span', { class: 'idx', text: '#' }), h('span', { text: tr('h_stage') }),
            h('span', { class: 'num', text: tr('h_amount') + ' (' + MFM.cur + ')' }), h('span', { text: tr('h_status') })
          ])])
        ].concat(state.st.map(stageRow)));
      }
      resize();
    }

    function draw() {
      summaryEl = h('div', { class: 'tiles' });
      barEl = h('div');
      rowsEl = h('div', { class: 'stages' });
      saveEl = h('div', { class: 'savebar' });
      errEl = h('div');

      var contract = h('input', {
        type: 'text', class: 'amt', inputmode: 'decimal', placeholder: tr('optional'), disabled: !canWrite,
        value: state.c ? MFM.moneyInput(state.c) : '',
        oninput: function () {
          var c = MFM.parseMoney(contract.value);
          if (c === null) { contract.classList.add('bad'); dirty = true; drawSave(); return; }
          contract.classList.remove('bad');
          if (c > 0) state.c = c; else delete state.c;
          markDirty();
        }
      });

      MFM.fill(root, [
        MFM.demo ? h('div', { class: 'demo-banner', text: tr('demo') }) : null,
        summaryEl, barEl, rowsEl, errEl,
        h('div', { class: 'foot' }, [
          h('button', { text: tr('add_stage'), disabled: !canWrite, onclick: function () {
            state.st.push(MFM.newStage('', 0)); dirty = true; draw();
            var names = root.querySelectorAll('input.name');
            if (names.length) names[names.length - 1].focus();
          } }),
          h('label', {}, [h('span', { text: tr('contract') }), contract]),
          h('span', { class: 'grow' }),
          saveEl
        ])
      ]);
      drawSummary(); drawRows(); drawSave(); drawErr();
    }

    // auto-save when the user clicks outside the schedule, so closing the card without pressing Save keeps the edits
    window.addEventListener('blur', function () { if (dirty && !saving && !conflict) save(); });

    return t.render(load);
  };
})();

</script>
<script>
/* Matter Fee Manager — board-level receivables overview (modal opened from the board button) */
(function () {
  'use strict';
  var MFM = window.MFM, h = MFM.h, tr = MFM.tr;

  function csvCell(v) {
    var s = String(v === undefined || v === null ? '' : v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;           // stop spreadsheet apps treating text as a formula
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  MFM.toCsv = function (rows) {
    var lines = [tr('csv_head')];
    rows.forEach(function (x) {
      if (!x.fee) return;
      x.fee.st.forEach(function (s) {
        var owing = s.s === 3 ? 0 : MFM.owing(s);
        lines.push([
          x.card.name, x.list, s.n, MFM.moneyInput(s.a), MFM.moneyInput(s.a - owing), MFM.moneyInput(owing),
          MFM.statusLabel(s.s), s.inv || '', s.d || '', s.pd || '', s.dd || '', s.bd || ''
        ].map(csvCell).join(','));
      });
    });
    return lines.join('\n');
  };

  MFM.mountOverview = function (t, root) {
    var showCsv = false, copied = false, lastRows = [];

    function load() {
      return Promise.all([
        t.cards('id', 'name', 'idList'), t.lists('id', 'name'), t.get('board', 'shared', MFM.CFG_KEY)
      ]).then(function (r) {
        MFM.cfg(r[2]);
        if (!MFM.canSee(t)) { lastRows = []; MFM.fill(root, [h('div', { class: 'note info', text: tr('no_access') })]); return null; }
        var cards = r[0] || [], lists = {};
        (r[1] || []).forEach(function (l) { lists[l.id] = l.name; });
        return Promise.all(cards.map(function (c) {
          return t.get(c.id, 'shared', MFM.KEY).then(function (fee) {
            return { card: c, list: lists[c.idList] || '', fee: fee ? MFM.normalize(fee) : null };
          }, function () {
            return { card: c, list: lists[c.idList] || '', fee: null };
          });
        }));
      }).then(function (rows) { if (rows) { lastRows = rows; draw(rows); } }, function (err) {
        MFM.fill(root, [h('div', { class: 'note err', text: tr('err_read', err && err.message ? err.message : tr('err_unknown')) })]);
      });
    }

    function cardLink(card) {
      return h('a', { class: 'link', text: card.name, title: tr('open_card'), onclick: function () {
        Promise.resolve(t.showCard(card.id)).then(function () { return t.closeModal(); }, function () { /* ignore */ });
      } });
    }

    function csvPanel(rows) {
      var area = h('textarea', { readonly: true, class: 'csv' });
      area.value = MFM.toCsv(rows);
      var copyBtn = h('button', { class: 'primary', text: copied ? tr('copied') : tr('copy'), onclick: function () {
        area.focus(); area.select();
        var done = function () { copied = true; copyBtn.textContent = tr('copied'); };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(area.value).then(done, function () { if (document.execCommand('copy')) done(); });
          else if (document.execCommand('copy')) done();
        } catch (e) { /* the text stays selected so it can be copied by hand */ }
      } });
      return h('div', { class: 'csvbox' }, [
        h('div', { class: 'muted', text: tr('export_hint') }),
        area,
        h('div', { class: 'foot' }, [h('span', { class: 'grow' }), h('button', { text: tr('close'), onclick: function () { showCsv = false; copied = false; draw(lastRows); } }), copyBtn])
      ]);
    }

    function draw(rows) {
      var today = MFM.today();
      var withFee = rows.filter(function (x) { return x.fee && x.fee.st.length; });
      var tot = { toInvoice: 0, awaiting: 0, overdue: 0, outstanding: 0, paid: 0 };
      var todo = [];

      withFee.forEach(function (x) {
        x.sum = MFM.summarize(x.fee, today);
        tot.toInvoice += x.sum.toInvoice; tot.awaiting += x.sum.awaiting;
        tot.overdue += x.sum.overdue; tot.outstanding += x.sum.outstanding; tot.paid += x.sum.paid;
        x.fee.st.forEach(function (s) {
          if (s.s !== 1 && s.s !== 2) return;
          if (MFM.owing(s) <= 0) return;
          var note = MFM.stageNote(s, today);
          // sort: overdue (most days first) > to invoice (longest wait first) > not yet due (soonest first)
          var rank = note.kind === 'late' ? 3e6 + note.days : (s.s === 1 ? 2e6 + note.days : 1e6 + note.days);
          todo.push({ x: x, s: s, note: note, rank: rank });
        });
      });
      todo.sort(function (a, b) { return b.rank - a.rank; });

      var tile = function (cls, k, v, sub) {
        return h('div', { class: 'tile' + cls }, [h('div', { class: 'k', text: k }), h('div', { class: 'v', text: MFM.fmtMoney(v) }), h('div', { class: 'sub', text: sub })]);
      };
      var tiles = h('div', { class: 'tiles five' }, [
        tile(tot.overdue > 0 ? ' late' : '', tr('t_over'), tot.overdue, tr('t_over_sub')),
        tile(tot.awaiting - tot.overdue > 0 ? ' hot' : '', tr('t_inv'), tot.awaiting - tot.overdue, tr('t_inv_sub')),
        tile(tot.toInvoice > 0 ? ' hot' : '', tr('t_done'), tot.toInvoice, tr('t_done_sub')),
        tile('', tr('t_bal'), tot.outstanding, tr('t_bal_sub')),
        tile('', tr('t_recv'), tot.paid, tr('t_recv_sub', withFee.length))
      ]);

      var todoTable;
      if (!todo.length) {
        todoTable = h('div', { class: 'empty', text: tr('none_todo') });
      } else {
        todoTable = h('table', {}, [
          h('thead', {}, [h('tr', {}, [
            h('th', { text: tr('c_matter') }), h('th', { text: tr('c_list') }), h('th', { text: tr('c_stage') }),
            h('th', { class: 'num', text: tr('c_amount') }), h('th', { text: tr('c_status') }), h('th', { text: tr('c_inv') }), h('th', { text: tr('c_timing') })
          ])]),
          h('tbody', {}, todo.map(function (it) {
            var late = it.note.kind === 'late', owing = MFM.owing(it.s);
            return h('tr', {}, [
              h('td', {}, [cardLink(it.x.card)]),
              h('td', { class: 'muted', text: it.x.list }),
              h('td', { text: it.s.n || tr('unnamed') }),
              h('td', { class: 'num' }, [MFM.fmtMoney(owing), owing !== it.s.a ? h('div', { class: 'hint', text: tr('of_amount', MFM.fmtMoney(it.s.a, true)) }) : null]),
              h('td', {}, [h('span', { class: 'pill ' + (late ? 'late' : 's' + it.s.s), text: late ? tr('t_over') : MFM.statusLabel(it.s.s) })]),
              h('td', { class: 'muted', text: it.s.inv || '—' }),
              h('td', { class: 'hint ' + (late ? 'late' : it.s.s === 1 ? 'warn' : ''), text: it.note.text })
            ]);
          }))
        ]);
      }

      withFee.sort(function (a, b) { return (b.sum.receivable - a.sum.receivable) || (b.sum.outstanding - a.sum.outstanding); });
      var allTable = !withFee.length
        ? h('div', { class: 'empty', text: tr('none_all') })
        : h('table', {}, [
          h('thead', {}, [h('tr', {}, [
            h('th', { text: tr('c_matter') }), h('th', { class: 'num', text: tr('c_total') }), h('th', { class: 'num', text: tr('c_received') }),
            h('th', { class: 'num', text: tr('c_now') }), h('th', { class: 'num', text: tr('c_notdue') }), h('th', { text: tr('c_prog') })
          ])]),
          h('tbody', {}, withFee.map(function (x) {
            var r = x.sum, base = r.sum > 0 ? r.sum : 1;
            var w = function (v) { return 'width:' + (v / base * 100).toFixed(1) + '%'; };
            return h('tr', {}, [
              h('td', {}, [cardLink(x.card), r.mismatch ? h('div', { class: 'hint warn', text: tr('mismatch_short') }) : null]),
              h('td', { class: 'num', text: MFM.fmtMoney(r.total) }),
              h('td', { class: 'num', text: MFM.fmtMoney(r.paid) }),
              h('td', { class: 'num', text: MFM.fmtMoney(r.receivable), style: r.overdue > 0 ? 'color:var(--red);font-weight:600' : (r.receivable > 0 ? 'color:var(--orange);font-weight:600' : '') }),
              h('td', { class: 'num muted', text: MFM.fmtMoney(r.notDue) }),
              h('td', {}, [
                h('span', { class: 'minibar' }, [
                  h('i', { style: w(r.paid) + ';background:var(--green)' }),
                  h('i', { style: w(r.overdue) + ';background:var(--red-bar)' }),
                  h('i', { style: w(r.awaiting - r.overdue) + ';background:var(--orange-bar)' }),
                  h('i', { style: w(r.toInvoice) + ';background:var(--yellow-bar)' })
                ]),
                h('span', { class: 'muted', text: ' ' + r.nPaid + '/' + r.n })
              ])
            ]);
          }))
        ]);

      MFM.fill(root, [
        MFM.demo ? h('div', { class: 'demo-banner', text: tr('demo_short') }) : null,
        tiles,
        h('h2', {}, [tr('h_todo'), h('small', { text: tr('h_todo_sub', todo.length) })]),
        todoTable,
        h('div', { class: 'h2row' }, [
          h('h2', {}, [tr('h_all'), h('small', { text: tr('h_all_sub') })]),
          withFee.length && !showCsv ? h('button', { text: tr('export'), onclick: function () { showCsv = true; draw(lastRows); } }) : null
        ]),
        showCsv ? csvPanel(withFee) : null,
        allTable,
        h('div', { class: 'note info', text: tr('footnote', MFM.fmtDate(today)) })
      ]);
    }

    return t.render(load);
  };
})();

</script>
<script>
/* Matter Fee Manager — board settings (Power-Up gear → Settings) */
(function () {
  'use strict';
  var MFM = window.MFM, h = MFM.h, tr = MFM.tr;

  MFM.mountSettings = function (t, root) {
    var cfg, msg = null;
    var drafts = []; // [{name, text}]

    function resize() { try { t.sizeTo('#' + root.id); } catch (e) { /* demo mode */ } }

    function draw() {
      MFM.useCfg(cfg);

      var lang = h('select', { style: 'max-width:280px', onchange: function () { cfg.lang = lang.value; draw(); } },
        [['auto', tr('s_lang_auto')], ['en', 'English'], ['zh', '简体中文']].map(function (o) {
          var el = h('option', { value: o[0], text: o[1] });
          if (cfg.lang === o[0]) el.selected = true;
          return el;
        }));
      var cur = h('input', { type: 'text', value: cfg.cur, maxlength: '4', style: 'width:90px',
        oninput: function () { cfg.cur = cur.value.trim() || '$'; } });
      var terms = h('input', { type: 'number', min: '0', max: '365', value: String(cfg.terms), style: 'width:90px',
        oninput: function () { var v = parseInt(terms.value, 10); if (isFinite(v) && v >= 0) cfg.terms = v; } });

      var tplEls = drafts.map(function (d, i) {
        var name = h('input', { type: 'text', value: d.name, placeholder: tr('ph_tpl_name'), maxlength: '40',
          oninput: function () { d.name = name.value; } });
        var text = h('textarea', { placeholder: tr('ph_tpl_lines'), oninput: function () { d.text = text.value; } });
        text.value = d.text;
        return h('div', { class: 'tpl' }, [
          h('div', { class: 'row' }, [name, h('button', { class: 'icon', text: '✕', title: tr('del_tpl'), onclick: function () { drafts.splice(i, 1); draw(); } })]),
          text
        ]);
      });

      MFM.fill(root, [
        h('div', { class: 'field' }, [h('label', { text: tr('s_lang') }), lang]),
        h('div', { class: 'field two' }, [
          h('div', {}, [h('label', { text: tr('s_cur') }), cur]),
          h('div', {}, [h('label', { text: tr('s_terms') }), terms, h('span', { class: 'muted', text: tr('s_days') })])
        ]),
        h('div', { class: 'field' }, [h('label', { text: tr('s_tpls') })].concat(tplEls).concat([
          h('button', { text: tr('new_tpl'), onclick: function () { drafts.push({ name: '', text: '' }); draw(); } })
        ])),
        msg ? h('div', { class: 'note ' + msg.kind, text: msg.text }) : null,
        h('div', { class: 'foot' }, [
          h('span', { class: 'muted small' }, [
            tr('about', MFM.VERSION) + ' ',
            h('a', { class: 'link', href: './privacy.html', target: '_blank', rel: 'noopener', text: tr('privacy') }), ' · ',
            h('a', { class: 'link', href: './support.html', target: '_blank', rel: 'noopener', text: tr('support') })
          ]),
          h('span', { class: 'grow' }),
          h('button', { class: 'primary', text: tr('save_settings'), onclick: save })
        ])
      ]);
      resize();
    }

    function save() {
      var out = { lang: cfg.lang, cur: cfg.cur, terms: cfg.terms, tpls: [] }, problems = [];
      drafts.forEach(function (d, i) {
        var name = d.name.trim();
        var parsed = MFM.parseTemplateLines(d.text);
        if (!name && !d.text.trim()) return; // ignore empty templates
        if (!name) problems.push(tr('e_noname', i + 1));
        if (parsed.badLines.length) problems.push(tr('e_badline', name || tr('e_tplname', i + 1), parsed.badLines.join(', ')));
        out.tpls.push({ n: name, st: parsed.stages });
      });
      if (problems.length) { msg = { kind: 'err', text: problems.join('; ') }; draw(); return; }
      if (MFM.sizeOf(out) > MFM.SIZE_LIMIT) { msg = { kind: 'err', text: tr('e_size') }; draw(); return; }
      t.set('board', 'shared', MFM.CFG_KEY, out).then(function () {
        msg = { kind: 'info', text: tr('saved') }; draw();
        return t.closePopup();
      }, function (err) {
        msg = { kind: 'err', text: tr('err_save', err && err.message ? err.message : tr('err_unknown')) }; draw();
      });
    }

    return t.get('board', 'shared', MFM.CFG_KEY).then(function (raw) {
      cfg = MFM.cfg(raw);
      drafts = cfg.tpls.map(function (tpl) { return { name: tpl.n, text: MFM.templateToText(tpl) }; });
      draw();
    });
  };
})();

</script>
<script>
(function () {
  var t = MFM.getT();
  document.getElementById('ver').textContent = MFM.VERSION;
  MFM.mountSection(t, document.getElementById('mfm-section'));
  MFM.mountOverview(t, document.getElementById('mfm-overview'));
  MFM.mountSettings(t, document.getElementById('mfm-settings'));
  t.render(function () {
    return Promise.all([t.get('card', 'shared', MFM.KEY), t.get('board', 'shared', MFM.CFG_KEY)]).then(function (r) {
      MFM.cfg(r[1]);
      document.getElementById('demo-name').textContent = t._store.cards[0].name;
      document.getElementById('demo-sec').textContent = MFM.tr('sec_title');
      MFM.fill(document.getElementById('demo-badges'), MFM.badges(r[0]).map(function (b) {
        return MFM.h('span', { class: 'bdg ' + (b.color || ''), text: b.text });
      }));
    });
  });
  function setLang(l) {
    t.get('board', 'shared', MFM.CFG_KEY).then(function (raw) {
      var c = MFM.cfg(raw); c.lang = l;
      return t.set('board', 'shared', MFM.CFG_KEY, c);
    }).then(function () { MFM.mountSettings(t, document.getElementById('mfm-settings')); });
  }
  document.getElementById('lang-en').onclick = function () { setLang('en'); };
  document.getElementById('lang-zh').onclick = function () { setLang('zh'); };
})();
</script>
