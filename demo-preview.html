<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Fee Manager — offline demo</title>
<style>
:root {
  --fg: #172b4d; --muted: #626f86; --line: #dcdfe4; --bg: transparent; --panel: #f7f8f9;
  --input-bg: #ffffff; --input-line: #b3b9c4; --focus: #388bff;
  --green: #1f845a; --green-bg: #dcfff1;
  --yellow: #7f5f01; --yellow-bg: #fff7d6; --yellow-bar: #e2b203;
  --orange: #a54800; --orange-bg: #fff3eb; --orange-bar: #f18d13;
  --red: #ae2e24; --red-bg: #ffeceb; --red-bar: #e2483d;
  --gray-bar: #dcdfe4; --btn: #091e420f; --btn-hover: #091e4224; --primary: #0c66e4; --primary-fg: #fff;
}
:root[data-theme="dark"] {
  --fg: #b6c2cf; --muted: #8c9bab; --line: #38414a; --panel: #22272b;
  --input-bg: #22272b; --input-line: #738496; --focus: #85b8ff;
  --green: #7ee2b8; --green-bg: #164b35;
  --yellow: #f5cd47; --yellow-bg: #533f04; --yellow-bar: #cf9f02;
  --orange: #fec195; --orange-bg: #702e00; --orange-bar: #f18d13;
  --red: #fd9891; --red-bg: #5d1f1a; --red-bar: #e2483d;
  --gray-bar: #454f59; --btn: #a1bdd914; --btn-hover: #a6c5e229; --primary: #579dff; --primary-fg: #1d2125;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); }
body {
  color: var(--fg);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.mfm { padding: 2px 2px 8px; }
.mfm.pad { padding: 16px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* summary */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tiles.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tile { background: var(--panel); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { font-size: 11.5px; color: var(--muted); min-height: 16px; }
.tile.hot { background: var(--orange-bg); }
.tile.hot .v, .tile.hot .k { color: var(--orange); }
.tile.late { background: var(--red-bg); }
.tile.late .v, .tile.late .k, .tile.late .sub { color: var(--red); }
.tile.done { background: var(--green-bg); }
.tile.done .v, .tile.done .k { color: var(--green); }

.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--gray-bar); margin: 10px 0 4px; }
.bar i { display: block; height: 100%; }
.bar .p { background: var(--green); } .bar .l { background: var(--red-bar); }
.bar .w { background: var(--orange-bar); } .bar .t { background: var(--yellow-bar); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--gray-bar); }
.legend .p::before { background: var(--green); } .legend .l::before { background: var(--red-bar); }
.legend .w::before { background: var(--orange-bar); } .legend .t::before { background: var(--yellow-bar); }

.note { border-radius: 6px; padding: 6px 10px; font-size: 12.5px; margin: 6px 0; }
.note.warn { background: var(--yellow-bg); color: var(--yellow); }
.note.err { background: var(--red-bg); color: var(--red); }
.note.info { background: var(--panel); color: var(--muted); }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th.num { text-align: right; }
td.idx { color: var(--muted); width: 22px; padding-top: 10px; font-size: 12px; }
tr.paid td input.name { color: var(--muted); }

input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--input-bg);
  border: 1px solid var(--input-line); border-radius: 4px; padding: 5px 6px; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
input.bad { outline: 2px solid var(--red-bar); outline-offset: -1px; }
input:disabled, select:disabled { opacity: .7; }
input.amt { text-align: right; font-variant-numeric: tabular-nums; }
td.c-amt { width: 104px; } td.c-st { width: 148px; } td.c-inv { width: 96px; } td.c-date { width: 136px; } td.c-act { width: 74px; white-space: nowrap; }
select.s0 { background: var(--input-bg); }
select.s1 { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-bar); font-weight: 600; }
select.s2 { background: var(--orange-bg); color: var(--orange); border-color: var(--orange-bar); font-weight: 600; }
select.s2.late { background: var(--red-bg); color: var(--red); border-color: var(--red-bar); }
select.s3 { background: var(--green-bg); color: var(--green); border-color: var(--green); font-weight: 600; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.hint.warn { color: var(--yellow); } .hint.late { color: var(--red); font-weight: 600; } .hint.ok { color: var(--green); }

.pill { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.s1 { background: var(--yellow-bg); color: var(--yellow); }
.pill.s2 { background: var(--orange-bg); color: var(--orange); }
.pill.late { background: var(--red-bg); color: var(--red); }

button { font: inherit; color: var(--fg); background: var(--btn); border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:hover { background: var(--btn-hover); }
button.primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
button.icon { padding: 4px 6px; background: transparent; color: var(--muted); font-size: 13px; line-height: 1; }
button.icon:hover { background: var(--btn-hover); color: var(--fg); }
button.danger { background: var(--red-bg); color: var(--red); font-size: 12px; padding: 4px 6px; }
button:disabled { opacity: .45; cursor: default; }
a.link { color: var(--primary); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }

.foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.foot .grow { flex: 1; }
.foot label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.foot label input { width: 110px; }
.savebar { display: flex; align-items: center; gap: 8px; }
.savebar .state { font-size: 12px; color: var(--muted); }
.savebar .state.dirty { color: var(--orange); font-weight: 600; }

h2 { font-size: 14px; margin: 18px 0 6px; }
h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.empty { padding: 14px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 8px; }
.demo-banner { background: var(--yellow-bg); color: var(--yellow); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 10px; }
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.tpl { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
.tpl .row { display: flex; gap: 6px; margin-bottom: 6px; }
textarea { min-height: 84px; resize: vertical; font-family: inherit; }
.minibar { display: inline-flex; width: 90px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--gray-bar); vertical-align: middle; }
.minibar i { display: block; height: 100%; }

@media (max-width: 560px) {
  .tiles, .tiles.five { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  td.c-inv, th.c-inv { display: none; }
  td.c-st { width: 120px; } td.c-date { width: 120px; }
}

/* fee schedule stage rows (two-line layout for the narrow card back) */
.stage { border-bottom: 1px solid var(--line); padding: 6px 0; }
.stage.head { padding: 4px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.stage .l1 { display: grid; grid-template-columns: 20px minmax(0, 1fr) 108px 156px; gap: 6px; align-items: center; }
.stage .l2 { display: grid; grid-template-columns: 20px 110px 190px minmax(0, 1fr) auto; gap: 6px; align-items: center; margin-top: 4px; }
.stage .idx { color: var(--muted); font-size: 12px; text-align: center; }
.stage .l2 input { padding: 3px 6px; font-size: 12.5px; }
.stage .dl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.stage .dl input { flex: 1; }
.stage .hint { margin-top: 0; overflow: hidden; text-overflow: ellipsis; }
.stage .acts { white-space: nowrap; }
.stage.paid input.name, .stage.paid input.amt { color: var(--muted); }
@media (max-width: 520px) {
  .stage .l1 { grid-template-columns: 20px minmax(0, 1fr) 96px; }
  .stage .l1 select { grid-column: 2 / 4; }
  .stage .l2 { grid-template-columns: 20px minmax(0, 1fr) minmax(0, 1.4fr); }
  .stage .l2 .hint { grid-column: 2 / 3; }
  .stage .l2 .acts { grid-column: 3 / 4; text-align: right; }
}
@media (max-width: 520px) { .stage.head .l1 span:nth-child(4) { display: none; } }

body { background: #f1f2f4; padding: 20px; }
.demo-wrap { max-width: 760px; margin: 0 auto 20px; background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 2px #091e4226; }
.demo-wrap.wide { max-width: 980px; }
.demo-h { font-size: 12px; font-weight: 700; color: #626f86; letter-spacing: .04em; margin-bottom: 10px; }
.front { width: 272px; background: #fff; border-radius: 8px; box-shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f; padding: 8px 12px; }
.front .nm { margin-bottom: 6px; }
.bdg { display: inline-block; border-radius: 3px; padding: 1px 6px; font-size: 12px; margin: 0 4px 4px 0; background: #091e420f; }
.bdg.red { background: #c9372c; color: #fff; } .bdg.orange { background: #e2740f; color: #fff; }
.bdg.yellow { background: #f5cd47; color: #533f04; } .bdg.green { background: #1f845a; color: #fff; }
.sec-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="demo-wrap"><div class="demo-h">① CARD FRONT BADGES (see at a glance who owes money)</div><div class="front"><div class="nm">Sample Client A — 482</div><div id="demo-badges"></div></div></div>
<div class="demo-wrap"><div class="demo-h">② CARD BACK: STAGED FEE SCHEDULE (try it: change a status, edit an amount, add a stage)</div><div class="sec-title">Staged fee schedule</div><div id="mfm-section" class="mfm"></div></div>
<div class="demo-wrap wide"><div class="demo-h">③ BOARD BUTTON: RECEIVABLES OVERVIEW (whole board)</div><div id="mfm-overview" class="mfm"></div></div>
<script>
/* Matter Fee Manager — shared logic (money, dates, statuses, totals, badges, demo data)
 * Where data lives:
 *   card   t.set('card',  'shared', 'fee', {...})   the staged fee schedule of each card
 *   board  t.set('board', 'shared', 'cfg', {...})   payment terms, stage templates
 * Trello limit: 4096 characters of serialized data per scope/visibility pair.
 */
(function (root) {
  'use strict';

  var MFM = {};
  MFM.KEY = 'fee';
  MFM.CFG_KEY = 'cfg';
  MFM.SIZE_LIMIT = 3900; // headroom below 4096

  // Status: 0 not started → 1 done, to invoice → 2 invoiced, unpaid → 3 paid
  MFM.STATUS = [
    { id: 0, label: 'Not started', cls: 's0' },
    { id: 1, label: 'Done · to invoice', cls: 's1' },
    { id: 2, label: 'Invoiced · unpaid', cls: 's2' },
    { id: 3, label: 'Paid', cls: 's3' }
  ];

  MFM.DEFAULT_CFG = {
    terms: 7,
    tpls: [
      {
        n: 'Three-stage example (fill in amounts)',
        st: [
          { n: 'Engagement / first instalment', a: 0 },
          { n: 'Application lodged', a: 0 },
          { n: 'Grant / file closed', a: 0 }
        ]
      }
    ]
  };

  /* ---------- dates ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  MFM.today = function () { return iso(new Date()); };
  MFM.addDays = function (s, n) {
    var d = parseIso(s);
    if (!d) return '';
    d.setDate(d.getDate() + n);
    return iso(d);
  };
  MFM.daysBetween = function (a, b) {
    var x = parseIso(a), y = parseIso(b);
    if (!x || !y) return 0;
    return Math.round((y.getTime() - x.getTime()) / 86400000);
  };
  MFM.fmtDate = function (s) {
    var d = parseIso(s);
    return d ? pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() : '';
  };

  /* ---------- money (stored as integer cents to avoid float errors) ---------- */
  MFM.parseMoney = function (v) {
    if (typeof v === 'number') return isFinite(v) && v >= 0 ? Math.round(v * 100) : null;
    var s = String(v == null ? '' : v).replace(/[\s,，$＄]/g, '').replace(/^(AUD|A)/i, '');
    if (s === '') return 0;
    var m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(s);
    if (!m) return null;
    var cents = parseInt(m[1], 10) * 100;
    if (m[2]) cents += parseInt((m[2] + '0').slice(0, 2), 10);
    return cents;
  };
  MFM.fmtMoney = function (cents, short) {
    cents = Math.round(cents || 0);
    var neg = cents < 0;
    if (neg) cents = -cents;
    var dollars = Math.floor(cents / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var c = cents % 100;
    var out = '$' + dollars + (short && c === 0 ? '' : '.' + pad(c));
    return neg ? '-' + out : out;
  };
  MFM.moneyInput = function (cents) {
    cents = Math.round(cents || 0);
    return Math.floor(cents / 100) + '.' + pad(cents % 100);
  };

  /* ---------- data shape ---------- */
  MFM.newId = function () {
    return Math.random().toString(36).slice(2, 8);
  };
  MFM.newStage = function (name, amount) {
    return { i: MFM.newId(), n: name || '', a: amount || 0, s: 0 };
  };
  // normalise whatever was stored into {v, c?, st:[{i,n,a,s,inv,d,dd,bd,pd}]}
  MFM.normalize = function (fee) {
    var out = { v: 1, st: [] };
    if (!fee || typeof fee !== 'object') return out;
    if (typeof fee.c === 'number' && fee.c > 0) out.c = Math.round(fee.c);
    (fee.st || []).forEach(function (s) {
      if (!s || typeof s !== 'object') return;
      var st = {
        i: s.i || MFM.newId(),
        n: String(s.n || ''),
        a: typeof s.a === 'number' && isFinite(s.a) ? Math.round(s.a) : 0,
        s: s.s === 1 || s.s === 2 || s.s === 3 ? s.s : 0
      };
      ['inv', 'd', 'dd', 'bd', 'pd'].forEach(function (k) { if (s[k]) st[k] = String(s[k]); });
      out.st.push(st);
    });
    return out;
  };
  // drop empty fields before saving to save characters
  MFM.compact = function (fee) {
    var n = MFM.normalize(fee);
    n.st.forEach(function (s) { s.n = s.n.trim(); });
    return n;
  };
  MFM.cfg = function (raw) {
    var d = MFM.DEFAULT_CFG;
    if (!raw || typeof raw !== 'object') return JSON.parse(JSON.stringify(d));
    var terms = parseInt(raw.terms, 10);
    var out = { terms: isFinite(terms) && terms >= 0 ? terms : d.terms, tpls: [] };
    (Array.isArray(raw.tpls) ? raw.tpls : d.tpls).forEach(function (t) {
      if (!t || !t.n) return;
      out.tpls.push({
        n: String(t.n),
        st: (t.st || []).map(function (s) { return { n: String(s.n || ''), a: Math.round(s.a || 0) }; })
      });
    });
    return out;
  };
  MFM.fromTemplate = function (tpl) {
    return { v: 1, st: (tpl && tpl.st ? tpl.st : []).map(function (s) { return MFM.newStage(s.n, s.a); }) };
  };
  // template text: one stage per line, "Stage name | amount"
  MFM.parseTemplateLines = function (text) {
    var out = [], bad = [];
    String(text || '').split(/\r?\n/).forEach(function (line, idx) {
      line = line.trim();
      if (!line) return;
      var parts = line.split(/[|｜]/);
      var name = parts[0].trim();
      var amt = parts.length > 1 ? MFM.parseMoney(parts.slice(1).join('')) : 0;
      if (!name || amt === null) { bad.push(idx + 1); return; }
      out.push({ n: name, a: amt });
    });
    return { stages: out, badLines: bad };
  };
  MFM.templateToText = function (tpl) {
    return (tpl.st || []).map(function (s) { return s.n + ' | ' + MFM.moneyInput(s.a); }).join('\n');
  };

  /* ---------- status change: stamp dates automatically ---------- */
  MFM.setStatus = function (stage, to, cfg, today) {
    today = today || MFM.today();
    var terms = cfg && typeof cfg.terms === 'number' ? cfg.terms : MFM.DEFAULT_CFG.terms;
    to = +to;
    if (to >= 1 && !stage.dd) stage.dd = today;                 // date work completed
    if (to >= 2 && !stage.bd) stage.bd = today;                 // invoice date
    if (to >= 2 && !stage.d) stage.d = MFM.addDays(stage.bd, terms); // payment due date
    if (to >= 3 && !stage.pd) stage.pd = today;                 // date paid
    if (to < 3) delete stage.pd;
    if (to < 2) { delete stage.bd; delete stage.d; }
    if (to < 1) delete stage.dd;
    stage.s = to;
    return stage;
  };

  /* ---------- per-stage timing note ---------- */
  MFM.stageNote = function (stage, today) {
    today = today || MFM.today();
    if (stage.s === 1) {
      var w = stage.dd ? MFM.daysBetween(stage.dd, today) : 0;
      return { kind: 'warn', days: w, text: w > 0 ? 'Done ' + w + 'd ago, not invoiced' : 'Done today, to invoice' };
    }
    if (stage.s === 2) {
      if (!stage.d) return { kind: 'wait', days: 0, text: 'No due date set' };
      var late = MFM.daysBetween(stage.d, today);
      if (late > 0) return { kind: 'late', days: late, text: late + (late === 1 ? ' day' : ' days') + ' overdue' };
      if (late === 0) return { kind: 'wait', days: 0, text: 'Due today' };
      return { kind: 'wait', days: late, text: 'Due in ' + (-late) + (late === -1 ? ' day' : ' days') };
    }
    if (stage.s === 3) return { kind: 'ok', days: 0, text: stage.pd ? 'Paid ' + MFM.fmtDate(stage.pd) : 'Paid' };
    return { kind: 'none', days: 0, text: '' };
  };

  /* ---------- totals ---------- */
  MFM.summarize = function (fee, today) {
    today = today || MFM.today();
    var f = MFM.normalize(fee);
    var r = {
      n: f.st.length, nPaid: 0,
      sum: 0,        // sum of all stages
      paid: 0,       // paid
      toInvoice: 0,  // done, to invoice
      awaiting: 0,   // invoiced, unpaid (incl. overdue)
      overdue: 0,    // of which overdue
      overdueDays: 0,
      notDue: 0,     // not started
      contract: f.c || null
    };
    f.st.forEach(function (s) {
      r.sum += s.a;
      if (s.s === 3) { r.paid += s.a; r.nPaid++; }
      else if (s.s === 2) {
        r.awaiting += s.a;
        var late = s.d ? MFM.daysBetween(s.d, today) : 0;
        if (late > 0) { r.overdue += s.a; if (late > r.overdueDays) r.overdueDays = late; }
      }
      else if (s.s === 1) r.toInvoice += s.a;
      else r.notDue += s.a;
    });
    r.receivable = r.toInvoice + r.awaiting;        // due now but not yet received
    r.total = r.contract !== null ? r.contract : r.sum;
    r.mismatch = r.contract !== null && r.contract !== r.sum;
    r.outstanding = r.sum - r.paid;                 // contract balance still to collect
    return r;
  };

  /* ---------- card front badges ---------- */
  MFM.badges = function (fee, today) {
    if (!fee) return [];
    var r = MFM.summarize(fee, today);
    if (!r.n) return [];
    var out = [];
    if (r.overdue > 0) out.push({ text: 'Overdue ' + MFM.fmtMoney(r.overdue, true) + ' · ' + r.overdueDays + 'd', color: 'red' });
    if (r.awaiting - r.overdue > 0) out.push({ text: 'Unpaid ' + MFM.fmtMoney(r.awaiting - r.overdue, true), color: 'orange' });
    if (r.toInvoice > 0) out.push({ text: 'To invoice ' + MFM.fmtMoney(r.toInvoice, true), color: 'yellow' });
    if (!out.length) {
      if (r.sum > 0 && r.paid === r.sum) out.push({ text: 'Paid in full ' + MFM.fmtMoney(r.sum, true), color: 'green' });
      else out.push({ text: 'Paid ' + MFM.fmtMoney(r.paid, true) + ' / ' + MFM.fmtMoney(r.sum, true) });
    }
    return out;
  };

  MFM.sizeOf = function (obj) { return JSON.stringify(obj).length; };

  /* ---------- tiny DOM helper (textContent only, no HTML strings) ---------- */
  MFM.h = function (tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  };

  // replace children (null / false are skipped)
  MFM.fill = function (el, kids) {
    el.replaceChildren.apply(el, (kids || []).filter(function (k) { return k !== null && k !== undefined && k !== false; }));
    return el;
  };

  MFM.applyTheme = function (t) {
    try {
      var ctx = t.getContext ? t.getContext() : null;
      var set = function (theme) { document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light'); };
      if (ctx && ctx.initialTheme) set(ctx.initialTheme);
      if (typeof t.subscribeToThemeChanges === 'function') t.subscribeToThemeChanges(set);
    } catch (e) { /* stay on the light theme if the theme API is unavailable */ }
  };

  /* ---------- Trello vs demo environment ---------- */
  MFM.inTrello = function () {
    return !!(root.TrelloPowerUp && root.location && root.location.hash && root.location.hash.length > 1);
  };
  MFM.getT = function () {
    if (MFM.inTrello()) return root.TrelloPowerUp.iframe();
    MFM.demo = true;
    return MFM.mockT();
  };

  // fictional demo data (not real clients), used only when a page is opened outside Trello
  var mock = null;
  MFM.mockT = function () {
    if (mock) return mock;
    var today = MFM.today();
    var ago = function (n) { return MFM.addDays(today, -n); };
    var store = {
      board: { cfg: JSON.parse(JSON.stringify(MFM.DEFAULT_CFG)) },
      lists: [{ id: 'l1', name: 'Preparing' }, { id: 'l2', name: 'Lodged' }],
      cards: [
        { id: 'c1', name: 'Sample Client A — 482', idList: 'l2' },
        { id: 'c2', name: 'Sample Client B — 820', idList: 'l1' },
        { id: 'c3', name: 'Sample Client C — 186', idList: 'l2' },
        { id: 'c4', name: 'Sample Client D — 600 (no fee schedule)', idList: 'l1' }
      ],
      fee: {
        c1: { v: 1, c: 660000, st: [
          { i: 'a1', n: 'Engagement / first instalment', a: 165000, s: 3, inv: 'INV-0001', dd: ago(60), bd: ago(60), d: ago(53), pd: ago(58) },
          { i: 'a2', n: 'SBS + Nomination lodged', a: 220000, s: 2, inv: 'INV-0002', dd: ago(21), bd: ago(20), d: ago(13) },
          { i: 'a3', n: 'Visa application lodged', a: 165000, s: 1, dd: ago(3) },
          { i: 'a4', n: 'Grant / file closed', a: 110000, s: 0 }
        ] },
        c2: { v: 1, st: [
          { i: 'b1', n: 'Engagement / first instalment', a: 200000, s: 3, inv: 'INV-0003', dd: ago(30), bd: ago(30), d: ago(23), pd: ago(29) },
          { i: 'b2', n: 'Application lodged', a: 250000, s: 2, inv: 'INV-0004', dd: ago(2), bd: ago(2), d: MFM.addDays(today, 5) },
          { i: 'b3', n: 'Grant', a: 100000, s: 0 }
        ] },
        c3: { v: 1, st: [
          { i: 'd1', n: 'Engagement / first instalment', a: 300000, s: 3, inv: 'INV-0005', dd: ago(90), bd: ago(90), d: ago(83), pd: ago(88) },
          { i: 'd2', n: 'Grant / file closed', a: 300000, s: 3, inv: 'INV-0006', dd: ago(10), bd: ago(10), d: ago(3), pd: ago(5) }
        ] }
      }
    };
    var renderers = [];
    var fire = function () { renderers.forEach(function (fn) { setTimeout(fn, 0); }); };
    var cardId = function (scope) { return scope === 'card' ? 'c1' : scope; };
    mock = {
      _store: store,
      get: function (scope, vis, key, def) {
        var v;

        fire();
        return Promise.resolve();
      },
      remove: function (scope, vis, key) {

        else if (store[key]) delete store[key][cardId(scope)];
        fire();
        return Promise.resolve();
      },
      render: function (fn) { renderers.push(fn); return fn(); },

      showCard: function (id) { window.console && console.log('[demo] open card', id); return Promise.resolve(); },

<script>
/* Matter Fee Manager — the staged fee schedule on the card back
 * Save strategy: Trello reloads the card-back-section iframe after t.set, so text and
 * amount edits stay local (shown as "unsaved") and are written in one go when:
 *   1) a status changes  2) Save is clicked  3) the user clicks outside the schedule (window blur)
 */
(function () {
  'use strict';
  var MFM = window.MFM, h = MFM.h;

  MFM.mountSection = function (t, root) {
    var state = { v: 1, st: [] };
    var cfg = MFM.cfg(null);
    var dirty = false, saving = false, canWrite = true, errMsg = '', armedDelete = null;
    var summaryEl, barEl, saveEl, errEl;

    try {
      var ctx = t.getContext() || {};
      if (ctx.permissions && ctx.permissions.card && ctx.permissions.card !== 'write') canWrite = false;
    } catch (e) { /* if permissions are unavailable assume writable; a failed write shows an error */ }

    function resize() { try { t.sizeTo('#' + root.id); } catch (e) { /* demo mode */ } }

    function load() {
      return Promise.all([
        t.get('card', 'shared', MFM.KEY),
        t.get('board', 'shared', MFM.CFG_KEY)
      ]).then(function (r) {
        cfg = MFM.cfg(r[1]);
        if (!dirty && !saving) state = MFM.normalize(r[0]);
        draw();
      });
    }

    function markDirty() {
      dirty = true;
      drawSummary();
      drawSave();
    }

    function hasBadAmount() { return !!root.querySelector('input.bad'); }

    function save() {
      if (!canWrite || saving) return Promise.resolve(false);
      if (hasBadAmount()) { errMsg = 'An amount is not valid (digits only, up to two decimals). Fix it, then save.'; drawErr(); return Promise.resolve(false); }
      var payload = MFM.compact(state);
      if (MFM.sizeOf(payload) > MFM.SIZE_LIMIT) {
        errMsg = 'This exceeds Trello\'s per-card storage limit (about 4,000 characters). Shorten stage names or use fewer stages.';
        drawErr();
        return Promise.resolve(false);
      }
      saving = true; errMsg = ''; drawSave(); drawErr();
      return t.set('card', 'shared', MFM.KEY, payload).then(function () {
        saving = false; dirty = false; drawSave();
        return true;
      }, function (err) {
        saving = false;
        errMsg = 'Save failed: ' + (err && err.message ? err.message : 'unknown error') + '. Your edits are still on the page; try again.';
        drawSave(); drawErr();
        return false;
      });
    }

    function revert() { dirty = false; errMsg = ''; load(); }

    /* ---------- summary ---------- */
    function drawSummary() {
      var r = MFM.summarize(state);
      var kids = [];
      kids.push(h('div', { class: 'tile' }, [
        h('div', { class: 'k', text: 'Contract total' }),
        h('div', { class: 'v', text: MFM.fmtMoney(r.total) }),
        h('div', { class: 'sub', text: r.n + (r.n === 1 ? ' stage' : ' stages') })
      ]));
      kids.push(h('div', { class: 'tile' + (r.sum > 0 && r.paid === r.sum ? ' done' : '') }, [
        h('div', { class: 'k', text: 'Received' }),
        h('div', { class: 'v', text: MFM.fmtMoney(r.paid) }),
        h('div', { class: 'sub', text: r.nPaid + ' / ' + r.n + ' stages' })
      ]));
      var sub = [];
      if (r.toInvoice > 0) sub.push('To invoice ' + MFM.fmtMoney(r.toInvoice, true));
      if (r.awaiting > 0) sub.push('Unpaid ' + MFM.fmtMoney(r.awaiting, true));
      if (r.overdue > 0) sub.push(r.overdueDays + 'd overdue');
      kids.push(h('div', { class: 'tile' + (r.overdue > 0 ? ' late' : (r.receivable > 0 ? ' hot' : '')) }, [
        h('div', { class: 'k', text: 'Receivable now' }),
        h('div', { class: 'v', text: MFM.fmtMoney(r.receivable) }),
        h('div', { class: 'sub', text: sub.join(' · ') || 'Nothing due right now' })
      ]));
      kids.push(h('div', { class: 'tile' }, [
        h('div', { class: 'k', text: 'Not yet due' }),
        h('div', { class: 'v', text: MFM.fmtMoney(r.notDue) }),
        h('div', { class: 'sub', text: 'Work not done yet' })
      ]));
      MFM.fill(summaryEl, kids);

      var base = r.sum > 0 ? r.sum : 1;
      var pct = function (v) { return 'width:' + (v / base * 100).toFixed(2) + '%'; };
      MFM.fill(barEl, [
        h('div', { class: 'bar' }, [
          h('i', { class: 'p', style: pct(r.paid) }),
          h('i', { class: 'l', style: pct(r.overdue) }),
          h('i', { class: 'w', style: pct(r.awaiting - r.overdue) }),
          h('i', { class: 't', style: pct(r.toInvoice) })
        ]),
        h('div', { class: 'legend' }, [
          h('span', { class: 'p', text: 'Received' }),
          h('span', { class: 'l', text: 'Overdue' }),
          h('span', { class: 'w', text: 'Invoiced, unpaid' }),
          h('span', { class: 't', text: 'Done, to invoice' }),
          h('span', { text: 'Not yet due' })
        ]),
        r.mismatch ? h('div', {
          class: 'note warn',
          text: 'Stages add up to ' + MFM.fmtMoney(r.sum) + ' ≠ contract total ' + MFM.fmtMoney(r.contract) +
            ' (difference ' + MFM.fmtMoney(Math.abs(r.contract - r.sum)) + '). Check the stage amounts or the contract total.'
        }) : null
      ]);
      resize();
    }

    function drawSave() {
      if (!saveEl) return;
      if (!canWrite) { MFM.fill(saveEl, [h('span', { class: 'state', text: 'Read-only (you cannot edit this card)' })]); return; }
      if (saving) { MFM.fill(saveEl, [h('span', { class: 'state', text: 'Saving…' })]); return; }
      if (dirty) {
        MFM.fill(saveEl, [
          h('span', { class: 'state dirty', text: 'Unsaved changes' }),
          h('button', { text: 'Discard', onclick: revert }),
          h('button', { class: 'primary', text: 'Save', onclick: function () { save(); } })
        ]);
      } else {
        MFM.fill(saveEl, [h('span', { class: 'state', text: 'Saved' })]);
      }
    }

    function drawErr() {
      if (!errEl) return;
      MFM.fill(errEl, [errMsg ? h('div', { class: 'note err', text: errMsg }) : null]);
      resize();
    }

    /* ---------- stage rows ---------- */
    function stageRow(s, idx) {
      var note = MFM.stageNote(s);
      var dis = !canWrite;

      var name = h('input', {
        type: 'text', class: 'name', value: s.n, placeholder: 'Stage name (e.g. Application lodged)', maxlength: '60', disabled: dis,
        oninput: function () { s.n = name.value; markDirty(); }
      });
      var amt = h('input', {
        type: 'text', class: 'amt', inputmode: 'decimal', value: MFM.moneyInput(s.a), disabled: dis,
        oninput: function () {
          var c = MFM.parseMoney(amt.value);
          if (c === null) { amt.classList.add('bad'); dirty = true; drawSave(); return; }
          amt.classList.remove('bad');
          s.a = c; markDirty();
        },
        onblur: function () { if (!amt.classList.contains('bad')) amt.value = MFM.moneyInput(s.a); }
      });
      var sel = h('select', {
        class: 's' + s.s + (note.kind === 'late' ? ' late' : ''), disabled: dis,
        onchange: function () {
          MFM.setStatus(s, +sel.value, cfg);
          dirty = true;
          draw();
          save(); // a status change saves immediately
        }
      }, MFM.STATUS.map(function (st) {
        var o = h('option', { value: String(st.id), text: st.label });
        if (st.id === s.s) o.selected = true;
        return o;
      }));
      var inv = h('input', {
        type: 'text', value: s.inv || '', placeholder: 'Invoice no.', maxlength: '24', disabled: dis,
        oninput: function () { if (inv.value.trim()) s.inv = inv.value.trim(); else delete s.inv; markDirty(); }
      });

      // date field: paid stages show the date paid, others the payment due date (auto-filled from the terms on invoicing)
      var dateKey = s.s === 3 ? 'pd' : 'd';
      var date = h('input', {
        type: 'date', value: s[dateKey] || '', disabled: dis || s.s < 2,
        title: s.s === 3 ? 'Date paid' : 'Payment due date (applies once invoiced)',
        onchange: function () { if (date.value) s[dateKey] = date.value; else delete s[dateKey]; markDirty(); drawRows(); }
      });

      var del;
      if (armedDelete === s.i) {
        del = h('button', { class: 'danger', text: 'Confirm delete', disabled: dis, onclick: function () {
          state.st.splice(idx, 1); armedDelete = null; dirty = true; draw();
        } });
      } else {
        del = h('button', { class: 'icon', text: '✕', title: 'Delete this stage', disabled: dis, onclick: function () { armedDelete = s.i; drawRows(); } });
      }
      var move = function (d) {
        return function () {
          var j = idx + d;
          if (j < 0 || j >= state.st.length) return;
          var tmp = state.st[idx]; state.st[idx] = state.st[j]; state.st[j] = tmp;
          dirty = true; draw();
        };
      };

      var dates = [];
      if (s.dd) dates.push('Done ' + MFM.fmtDate(s.dd));
      if (s.bd) dates.push('Invoiced ' + MFM.fmtDate(s.bd));

      return h('div', { class: 'stage' + (s.s === 3 ? ' paid' : '') }, [
        h('div', { class: 'l1' }, [
          h('span', { class: 'idx', text: String(idx + 1) }),
          name, amt, sel
        ]),
        h('div', { class: 'l2' }, [
          h('span', { class: 'idx' }),
          inv,
          h('label', { class: 'dl' }, [h('span', { text: s.s === 3 ? 'Paid' : 'Due' }), date]),
          h('span', { class: 'hint ' + (note.kind === 'warn' ? 'warn' : note.kind === 'late' ? 'late' : note.kind === 'ok' ? 'ok' : ''),
            text: note.text, title: dates.join(' · ') }),
          h('span', { class: 'acts' }, [
            h('button', { class: 'icon', text: '↑', title: 'Move up', disabled: dis || idx === 0, onclick: move(-1) }),
            h('button', { class: 'icon', text: '↓', title: 'Move down', disabled: dis || idx === state.st.length - 1, onclick: move(1) }),
            del
          ])
        ])
      ]);
    }

    var rowsEl;
    function drawRows() {
      if (!state.st.length) {
        var kids = [h('div', { text: 'No fee stages yet.' })];
        if (canWrite) {
          var btns = cfg.tpls.map(function (tpl) {
            return h('button', { text: 'Use template: ' + tpl.n, onclick: function () {
              state.st = MFM.fromTemplate(tpl).st; dirty = true; draw();
            } });
          });
          kids.push(h('div', { class: 'foot', style: 'justify-content:center' }, btns));
        }
        MFM.fill(rowsEl, [h('div', { class: 'empty' }, kids)]);
      } else {
        MFM.fill(rowsEl, [
          h('div', { class: 'stage head' }, [h('div', { class: 'l1' }, [
            h('span', { class: 'idx', text: '#' }), h('span', { text: 'Stage' }),
            h('span', { class: 'num', text: 'Inc. GST ($)' }), h('span', { text: 'Status' })
          ])])
        ].concat(state.st.map(stageRow)));
      }
      resize();
    }

    function draw() {
      summaryEl = h('div', { class: 'tiles' });
      barEl = h('div');
      rowsEl = h('div', { class: 'stages' });
      saveEl = h('div', { class: 'savebar' });
      errEl = h('div');

      var contract = h('input', {
        type: 'text', class: 'amt', inputmode: 'decimal', placeholder: 'optional', disabled: !canWrite,
        value: state.c ? MFM.moneyInput(state.c) : '',
        oninput: function () {
          var c = MFM.parseMoney(contract.value);
          if (c === null) { contract.classList.add('bad'); dirty = true; drawSave(); return; }
          contract.classList.remove('bad');
          if (c > 0) state.c = c; else delete state.c;
          markDirty();
        }
      });

      MFM.fill(root, [
        MFM.demo ? h('div', { class: 'demo-banner', text: 'Demo mode: not connected to Trello. The data is fictional and resets on refresh.' }) : null,
        summaryEl, barEl, rowsEl, errEl,
        h('div', { class: 'foot' }, [
          h('button', { text: '+ Add stage', disabled: !canWrite, onclick: function () {
            state.st.push(MFM.newStage('', 0)); dirty = true; draw();
            var names = root.querySelectorAll('input.name');
            if (names.length) names[names.length - 1].focus();
          } }),
          h('label', {}, [h('span', { text: 'Contract total (for cross-check)' }), contract]),
          h('span', { class: 'grow' }),
          saveEl
        ])
      ]);
      drawSummary(); drawRows(); drawSave(); drawErr();
    }

    // auto-save when the user clicks outside the schedule, so closing the card without pressing Save does not lose edits
    window.addEventListener('blur', function () { if (dirty && !saving) save(); });

    return t.render(load);
  };
})();

</script>
<script>
/* Matter Fee Manager — board-level receivables overview (modal opened from the board button) */
(function () {
  'use strict';
  var MFM = window.MFM, h = MFM.h;

  MFM.mountOverview = function (t, root) {
    function load() {
      return Promise.all([t.cards('id', 'name', 'idList'), t.lists('id', 'name')]).then(function (r) {
        var cards = r[0] || [], lists = {};
        (r[1] || []).forEach(function (l) { lists[l.id] = l.name; });
        return Promise.all(cards.map(function (c) {
          return t.get(c.id, 'shared', MFM.KEY).then(function (fee) {
            return { card: c, list: lists[c.idList] || '', fee: fee ? MFM.normalize(fee) : null };
          }, function () {
            return { card: c, list: lists[c.idList] || '', fee: null };
          });
        }));
      }).then(draw, function (err) {
        MFM.fill(root, [h('div', { class: 'note err', text: 'Could not read board data: ' + (err && err.message ? err.message : 'unknown error') })]);
      });
    }

    function cardLink(card) {
      return h('a', { class: 'link', text: card.name, title: 'Open card', onclick: function () {
        Promise.resolve(t.showCard(card.id)).then(function () { return t.closeModal(); }, function () { /* ignore */ });
      } });
    }

    function draw(rows) {
      var today = MFM.today();
      var withFee = rows.filter(function (x) { return x.fee && x.fee.st.length; });
      var tot = { toInvoice: 0, awaiting: 0, overdue: 0, outstanding: 0, paid: 0 };
      var todo = [];

      withFee.forEach(function (x) {
        x.sum = MFM.summarize(x.fee, today);
        tot.toInvoice += x.sum.toInvoice; tot.awaiting += x.sum.awaiting;
        tot.overdue += x.sum.overdue; tot.outstanding += x.sum.outstanding; tot.paid += x.sum.paid;
        x.fee.st.forEach(function (s) {
          if (s.s !== 1 && s.s !== 2) return;
          var note = MFM.stageNote(s, today);
          // sort: overdue (most days first) > to invoice (longest wait first) > not yet due (soonest first)
          var rank = note.kind === 'late' ? 3e6 + note.days : (s.s === 1 ? 2e6 + note.days : 1e6 + note.days);
          todo.push({ x: x, s: s, note: note, rank: rank });
        });
      });
      todo.sort(function (a, b) { return b.rank - a.rank; });

      var tiles = h('div', { class: 'tiles five' }, [
        h('div', { class: 'tile' + (tot.overdue > 0 ? ' late' : '') }, [
          h('div', { class: 'k', text: 'Overdue' }), h('div', { class: 'v', text: MFM.fmtMoney(tot.overdue) }),
          h('div', { class: 'sub', text: 'Past the due date' })]),
        h('div', { class: 'tile' + (tot.awaiting - tot.overdue > 0 ? ' hot' : '') }, [
          h('div', { class: 'k', text: 'Invoiced, unpaid' }), h('div', { class: 'v', text: MFM.fmtMoney(tot.awaiting - tot.overdue) }),
          h('div', { class: 'sub', text: 'Not yet due' })]),
        h('div', { class: 'tile' + (tot.toInvoice > 0 ? ' hot' : '') }, [
          h('div', { class: 'k', text: 'Done, to invoice' }), h('div', { class: 'v', text: MFM.fmtMoney(tot.toInvoice) }),
          h('div', { class: 'sub', text: 'Time to bill' })]),
        h('div', { class: 'tile' }, [
          h('div', { class: 'k', text: 'Contract balance' }), h('div', { class: 'v', text: MFM.fmtMoney(tot.outstanding) }),
          h('div', { class: 'sub', text: 'Incl. stages not started' })]),
        h('div', { class: 'tile' }, [
          h('div', { class: 'k', text: 'Total received' }), h('div', { class: 'v', text: MFM.fmtMoney(tot.paid) }),
          h('div', { class: 'sub', text: withFee.length + ' matter(s) with a schedule' })])
      ]);

      var todoTable;
      if (!todo.length) {
        todoTable = h('div', { class: 'empty', text: 'Nothing to invoice or chase right now.' });
      } else {
        todoTable = h('table', {}, [
          h('thead', {}, [h('tr', {}, [
            h('th', { text: 'Matter (card)' }), h('th', { text: 'List' }), h('th', { text: 'Stage' }),
            h('th', { class: 'num', text: 'Amount' }), h('th', { text: 'Status' }), h('th', { text: 'Invoice no.' }), h('th', { text: 'Timing' })
          ])]),
          h('tbody', {}, todo.map(function (it) {
            var late = it.note.kind === 'late';
            return h('tr', {}, [
              h('td', {}, [cardLink(it.x.card)]),
              h('td', { class: 'muted', text: it.x.list }),
              h('td', { text: it.s.n || '(unnamed stage)' }),
              h('td', { class: 'num', text: MFM.fmtMoney(it.s.a) }),
              h('td', {}, [h('span', { class: 'pill ' + (late ? 'late' : 's' + it.s.s), text: late ? 'Overdue' : MFM.STATUS[it.s.s].label })]),
              h('td', { class: 'muted', text: it.s.inv || '—' }),
              h('td', { class: 'hint ' + (late ? 'late' : it.s.s === 1 ? 'warn' : ''), text: it.note.text })
            ]);
          }))
        ]);
      }

      withFee.sort(function (a, b) { return (b.sum.receivable - a.sum.receivable) || (b.sum.outstanding - a.sum.outstanding); });
      var allTable = !withFee.length
        ? h('div', { class: 'empty', text: 'No card on this board has a fee schedule yet. Open a card → click the "Fee schedule" button to create one.' })
        : h('table', {}, [
          h('thead', {}, [h('tr', {}, [
            h('th', { text: 'Matter (card)' }), h('th', { class: 'num', text: 'Contract total' }), h('th', { class: 'num', text: 'Received' }),
            h('th', { class: 'num', text: 'Receivable now' }), h('th', { class: 'num', text: 'Not yet due' }), h('th', { text: 'Progress' })
          ])]),
          h('tbody', {}, withFee.map(function (x) {
            var r = x.sum, base = r.sum > 0 ? r.sum : 1;
            var w = function (v) { return 'width:' + (v / base * 100).toFixed(1) + '%'; };
            return h('tr', {}, [
              h('td', {}, [cardLink(x.card), r.mismatch ? h('div', { class: 'hint warn', text: 'Stages ≠ contract total' }) : null]),
              h('td', { class: 'num', text: MFM.fmtMoney(r.total) }),
              h('td', { class: 'num', text: MFM.fmtMoney(r.paid) }),
              h('td', { class: 'num', text: MFM.fmtMoney(r.receivable), style: r.overdue > 0 ? 'color:var(--red);font-weight:600' : (r.receivable > 0 ? 'color:var(--orange);font-weight:600' : '') }),
              h('td', { class: 'num muted', text: MFM.fmtMoney(r.notDue) }),
              h('td', {}, [
                h('span', { class: 'minibar' }, [
                  h('i', { style: w(r.paid) + ';background:var(--green)' }),
                  h('i', { style: w(r.overdue) + ';background:var(--red-bar)' }),
                  h('i', { style: w(r.awaiting - r.overdue) + ';background:var(--orange-bar)' }),
                  h('i', { style: w(r.toInvoice) + ';background:var(--yellow-bar)' })
                ]),
                h('span', { class: 'muted', text: ' ' + r.nPaid + '/' + r.n })
              ])
            ]);
          }))
        ]);

      MFM.fill(root, [
        MFM.demo ? h('div', { class: 'demo-banner', text: 'Demo mode: fictional data.' }) : null,
        tiles,
        h('h2', {}, ['Needs follow-up', h('small', { text: todo.length + ' stage(s) · overdue → to invoice → not yet due' })]),
        todoTable,
        h('h2', {}, ['All matters', h('small', { text: 'sorted by amount receivable now' })]),
        allTable,
        h('div', { class: 'note info', text: 'Figures come from each card\'s fee schedule (as at ' + MFM.fmtDate(today) + ', archived cards excluded). Amounts are entered by hand and are not accounting or trust records.' })
      ]);
    }

    return t.render(load);
  };
})();

</script>
<script>
(function () {
  var t = MFM.getT();
  MFM.mountSection(t, document.getElementById('mfm-section'));
  MFM.mountOverview(t, document.getElementById('mfm-overview'));
  t.render(function () {
    return t.get('card', 'shared', MFM.KEY).then(function (fee) {
      MFM.fill(document.getElementById('demo-badges'), MFM.badges(fee).map(function (b) {
        return MFM.h('span', { class: 'bdg ' + (b.color || ''), text: b.text });
      }));
    });
  });
})();
</script>
</body>
</html>
